[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.6", features = ["derive"] }
git2 = { version = "0.21.0", features = ["https", "openssl-probe", "openssl-sys"] }
indexmap = { version = "2.14.1", features = ["serde"] }
log = "0.4.34"
logos = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_with = "3.22.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"] }
toml = "1.1.5"
tracing-subscriber = "0.3.23"
